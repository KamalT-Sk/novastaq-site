<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found | Novastaq Technologies Inc</title>
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #ffffff;
        color: #0b0b0f;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .container { max-width: 520px; width: 100%; }
      .badge {
        display: inline-block;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #4f46e5;
        background: #eef2ff;
        padding: 4px 10px;
        border-radius: 9999px;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 32px;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin-bottom: 12px;
      }
      p {
        font-size: 15px;
        line-height: 1.6;
        color: #71717a;
        margin-bottom: 24px;
      }
      .actions {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
      }
      a.btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 40px;
        padding: 0 18px;
        font-size: 13px;
        font-weight: 600;
        border-radius: 8px;
        text-decoration: none;
        transition: all 0.15s ease;
      }
      a.btn-primary {
        background-color: #0b0b0f;
        color: #ffffff;
      }
      a.btn-primary:hover { background-color: #27272a; }
      a.btn-secondary {
        background-color: #f4f4f5;
        color: #0b0b0f;
      }
      a.btn-secondary:hover { background-color: #e4e4e7; }
    </style>
  </head>
  <body>
    <div class="container">
      <span class="badge">404 Error</span>
      <h1>Page Not Found</h1>
      <p>The page or resource you requested does not exist on novastaq.com. It may have moved or been deleted.</p>
      <div class="actions">
        <a href="/" class="btn btn-primary">Return Home</a>
        <a href="/services" class="btn btn-secondary">Services</a>
        <a href="/procurement" class="btn btn-secondary">Procurement</a>
        <a href="/contact" class="btn btn-secondary">Contact Us</a>
      </div>
    </div>
  </body>
</html>
